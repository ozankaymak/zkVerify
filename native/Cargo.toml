[package]
name = "native"
description = "Provide a native implementation bridge for wasm executor"
version = "0.3.0"
license = "Apache-2.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
ark-bn254 = { version = "0.5.0", default-features = false }
ark-bn254-ext = { git = "https://github.com/zkVerify/accelerated-bn-cryptography.git", default-features = false, tag = "v0.6.0" }
ark-ec = { version = "0.5.0", default-features = false }
ark-scale = { features = ["hazmat"], version = "0.0.13", default-features = false }
risc0-verifier = { workspace = true }

sp-runtime-interface = { workspace = true }
codec = { workspace = true }
log = { workspace = true }
verifiers-traits = { workspace = true }
hp-groth16 = { workspace = true }

# Kimchi native verification — compiled only for native (std) builds.
ark-ff = { version = "0.5.0", default-features = false, optional = true }
ark-serialize = { version = "0.5.0", default-features = false, optional = true }
bincode = { version = "2", default-features = false, features = ["alloc", "serde"], optional = true }
kimchi = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false, optional = true }
mina-curves = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false, optional = true }
mina-poseidon = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false, optional = true }
poly-commitment = { git = "https://github.com/o1-labs/proof-systems", tag = "0.7.0", default-features = false, optional = true }
rand_chacha = { version = "0.3", default-features = false, optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
ark-ff = { version = "0.5.0", default-features = false }

[features]
default = [ "std" ]
std = [
	"ark-bn254-ext/std",
	"ark-bn254/std",
	"ark-ec/parallel",
	"ark-ec/std",
	"ark-ff/std",
	"ark-scale/std",
	"ark-serialize/std",
	"bincode?/std",
	"codec/std",
	# Kimchi deps
	"dep:ark-ff",
	"dep:ark-serialize",
	"dep:bincode",
	"dep:kimchi",
	"dep:mina-curves",
	"dep:mina-poseidon",
	"dep:poly-commitment",
	"dep:rand_chacha",
	"dep:rand_core",
	"hp-groth16/implementation",
	"hp-groth16/std",
	"kimchi/std",
	"log/std",
	"mina-poseidon/std",
	"poly-commitment/parallel",
	"poly-commitment/std",
	"rand_chacha/std",
	"rand_core/std",
	"sp-runtime-interface/std",
	"verifiers-traits/std",
]
